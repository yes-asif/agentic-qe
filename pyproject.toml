description = "Agentic, self-healing frontend test automation framework (LangGraph + Playwright MCP + Stagehand-style semantic actions)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Syed Asifulla" }
]
requires-python = ">=3.11"
