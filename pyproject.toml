    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]

[project.urls]
Homepage = "https://github.com/<your-username>/agentic-qe"
Repository = "https://github.com/<your-username>/agentic-qe"
